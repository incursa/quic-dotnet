name: incursa-http3-external-interop

services:
  incursa-server:
    build:
      context: ../../..
      dockerfile: scripts/interop/http3-external/docker/incursa-server.Dockerfile
    command:
      - /www
      - /certs/cert.pem
      - /certs/priv.key
      - "4433"
    ports:
      - "4433:4433/udp"
    volumes:
      - ${HTTP3_INTEROP_WWW:-./work/www}:/www:ro
      - ${HTTP3_INTEROP_CERTS:-./work/certs}:/certs:ro
      - ${HTTP3_INTEROP_LOGS:-./work/logs}/incursa-server:/logs
    environment:
      QLOGDIR: /logs/qlog
      SSLKEYLOGFILE: /logs/sslkeylog/keys.log
      INCURSA_QUIC_DEBUG_APP_RX: ${INCURSA_QUIC_DEBUG_APP_RX:-}

  incursa-client:
    build:
      context: ../../..
      dockerfile: scripts/interop/http3-external/docker/incursa-client.Dockerfile
    volumes:
      - ${HTTP3_INTEROP_DOWNLOADS:-./work/downloads}:/downloads
      - ${HTTP3_INTEROP_CERTS:-./work/certs}:/certs:ro
      - ${HTTP3_INTEROP_LOGS:-./work/logs}/incursa-client:/logs
    environment:
      QLOGDIR: /logs/qlog
      SSLKEYLOGFILE: /logs/sslkeylog/keys.log
      INCURSA_QUIC_DEBUG_APP_RX: ${INCURSA_QUIC_DEBUG_APP_RX:-}
    profiles:
      - clients

  curl:
    image: ${HTTP3_CURL_IMAGE:-ghcr.io/macbre/curl-http3}
    entrypoint: ["curl"]
    volumes:
      - ${HTTP3_INTEROP_DOWNLOADS:-./work/downloads}:/downloads
      - ${HTTP3_INTEROP_CERTS:-./work/certs}:/certs:ro
      - ${HTTP3_INTEROP_LOGS:-./work/logs}/curl:/logs
    environment:
      QLOGDIR: /logs/qlog
      SSLKEYLOGFILE: /logs/sslkeylog/keys.log
    profiles:
      - clients

  aioquic:
    build:
      context: ../../..
      dockerfile: scripts/interop/http3-external/docker/aioquic.Dockerfile
    volumes:
      - ${HTTP3_INTEROP_WWW:-./work/www}:/www:ro
      - ${HTTP3_INTEROP_DOWNLOADS:-./work/downloads}:/downloads
      - ${HTTP3_INTEROP_CERTS:-./work/certs}:/certs:ro
      - ${HTTP3_INTEROP_LOGS:-./work/logs}/aioquic:/logs
    environment:
      QLOGDIR: /logs/qlog
      SSLKEYLOGFILE: /logs/sslkeylog/keys.log
    profiles:
      - clients
      - peers

  aioquic-server:
    image: incursa-http3-external-interop-aioquic:latest
    command:
      - /usr/local/bin/aioquic-http3-server
      - /www
      - /certs/cert.pem
      - /certs/priv.key
      - "4433"
    volumes:
      - ${HTTP3_INTEROP_WWW:-./work/www}:/www:ro
      - ${HTTP3_INTEROP_CERTS:-./work/certs}:/certs:ro
      - ${HTTP3_INTEROP_LOGS:-./work/logs}/aioquic-server:/logs
    environment:
      QLOGDIR: /logs/qlog
      SSLKEYLOGFILE: /logs/sslkeylog/keys.log
    profiles:
      - peers

  quiche:
    image: ${HTTP3_QUICHE_IMAGE:-cloudflare/quiche:latest}
    volumes:
      - ${HTTP3_INTEROP_WWW:-./work/www}:/www:ro
      - ${HTTP3_INTEROP_DOWNLOADS:-./work/downloads}:/downloads
      - ${HTTP3_INTEROP_CERTS:-./work/certs}:/certs:ro
      - ${HTTP3_INTEROP_LOGS:-./work/logs}/quiche:/logs
    environment:
      QLOGDIR: /logs/qlog
      SSLKEYLOGFILE: /logs/sslkeylog/keys.log
    profiles:
      - clients
      - peers

  ngtcp2:
    image: ${HTTP3_NGTCP2_IMAGE:-ghcr.io/ngtcp2/ngtcp2-interop:latest}
    entrypoint: []
    volumes:
      - ${HTTP3_INTEROP_WWW:-./work/www}:/www:ro
      - ${HTTP3_INTEROP_DOWNLOADS:-./work/downloads}:/downloads
      - ${HTTP3_INTEROP_CERTS:-./work/certs}:/certs:ro
      - ${HTTP3_INTEROP_LOGS:-./work/logs}/ngtcp2:/logs
    environment:
      QLOGDIR: /logs/qlog
      SSLKEYLOGFILE: /logs/sslkeylog/keys.log
    profiles:
      - clients
      - peers
