id: quic-dotnet-raw-dev
name: QUIC.NET Development Raw QUIC
description: Package-carried ProtocolLab raw QUIC adapter and Incursa raw QUIC server built from the developer working tree.
image: ""
targetKind: process
targetContract: adapter-v1
executable: pwsh
project: ""
workingDirectory: .
dockerfile: ""
buildContext: ""
containerName: ""
dockerNetwork: ""
dockerNetworkMode: published-port
dockerBaseUrl: http://127.0.0.1:53591
baseUrl: http://127.0.0.1:53591
adapterControlPlaneBaseUrl: http://127.0.0.1:53591
certificateMode: none
roles:
  - server
supportedProtocols:
  - quic
supportedWorkloadFamilies:
  - quic.transport
supportedScenarios:
  - quic.transport.handshake-cold
  - quic.transport.latency.echo-1kb
  - quic.transport.connection-churn
  - quic.transport.stream-churn
  - quic.transport.stream-throughput.64kb
  - quic.transport.stream-throughput.1mb
  - quic.transport.stream-download.1mb
  - quic.transport.stream-throughput.16mb
  - quic.transport.sustained-stream.256x64kb
  - quic.transport.sustained-stream.16384x1kb
  - quic.transport.sustained-download.256x64kb
  - quic.transport.sustained-download.16384x1kb
  - quic.transport.sustained-download.4096x1kb
  - quic.transport.multiplex.100x1kb
  - quic.transport.multiplex.100x64kb
  - quic.transport.multiplex.16x1mb
  - quic.transport.multiplex.mixed-4x16
  - quic.transport.stream-limits.100x64kb
  - quic.transport.flow-control.slow-reader-16x64kb
  - quic.transport.duplex-streams
  - quic.transport.duplex-streams.16x1mb
  - quic.transport.duplex-streams-peer-matrix
supportedTestCaseIds:
  - quic.transport.handshake-cold
  - quic.transport.latency.echo-1kb
  - quic.transport.connection-churn
  - quic.transport.stream-churn
  - quic.transport.stream-throughput.64kb
  - quic.transport.stream-throughput.1mb
  - quic.transport.stream-download.1mb
  - quic.transport.stream-throughput.16mb
  - quic.transport.sustained-stream.256x64kb
  - quic.transport.sustained-stream.16384x1kb
  - quic.transport.sustained-download.256x64kb
  - quic.transport.sustained-download.16384x1kb
  - quic.transport.sustained-download.4096x1kb
  - quic.transport.multiplex.100x1kb
  - quic.transport.multiplex.100x64kb
  - quic.transport.multiplex.16x1mb
  - quic.transport.multiplex.mixed-4x16
  - quic.transport.stream-limits.100x64kb
  - quic.transport.flow-control.slow-reader-16x64kb
  - quic.transport.duplex-streams
  - quic.transport.duplex-streams.16x1mb
  - quic.transport.duplex-streams-peer-matrix
ports:
  - name: control-plane
    containerPort: 53591
    hostPort: 53591
    protocol: tcp
environment:
  ASPNETCORE_URLS: http://127.0.0.1:53591
dockerEnvironment: {}
commandArguments:
  - -NoLogo
  - -NoProfile
  - -File
  - scripts/run-current-platform.ps1
readinessCheck:
  type: http
  url: /protocol-lab/adapter/v1/health
  timeoutSeconds: 10
shutdownBehavior: process-exit
capabilities:
  - quicTransport
  - quicHandshake
  - quicStreams
  - quicMultiplexing
  - quicDuplex
artifactExports:
  - server.stdout.txt
  - server.stderr.txt
  - server.command.txt
  - session.json
  - endpoint.json
qlogSupport: false
sslKeyLogSupport: false
notes: Trusted lab package execution only. This raw QUIC target is framework-dependent and carries Linux x64 and Windows x64 entrypoint payloads; it launches the ProtocolLab adapter control plane and a prebuilt package-local IncursaRawQuicServer child process for QUIC transport scenarios.
