name: Nightly Performance Diagnostics

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  benchmarkdotnet-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: performance-diagnostics-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore benchmark project
        run: dotnet restore benchmarks/Incursa.Quic.Benchmarks.csproj

      - name: Build benchmark project
        run: dotnet build benchmarks/Incursa.Quic.Benchmarks.csproj --no-restore --configuration Release -p:ContinuousIntegrationBuild=true

      - name: Run BenchmarkDotNet diagnostics
        shell: pwsh
        run: |
          ./scripts/benchmarks/Invoke-QuicBaseline.ps1 `
            -Job Short `
            -NoRestore `
            -NoBuild `
            -ArtifactsRoot "artifacts/bdn-nightly/${{ github.run_id }}"

      - name: Upload BenchmarkDotNet diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarkdotnet-diagnostics-${{ github.run_id }}
          path: artifacts/bdn-nightly/
          if-no-files-found: warn
          retention-days: 14
