name: CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    env:
      SPEC_TRACE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      SPEC_TRACE_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore local tools
        run: dotnet tool restore

      - name: Determine SpecTrace scope
        id: spectrace
        shell: pwsh
        run: |
          $baseSha = '${{ env.SPEC_TRACE_BASE_SHA }}'
          $headSha = '${{ env.SPEC_TRACE_HEAD_SHA }}'
          if ([string]::IsNullOrWhiteSpace($baseSha) -or $baseSha -eq '0000000000000000000000000000000000000000') {
            $baseSha = (git rev-list --max-parents=0 $headSha | Select-Object -First 1)
          }

          $scopes = @(
            git diff --name-only $baseSha $headSha -- 'specs/**/*.json' |
              Where-Object { $_ -and -not $_.StartsWith('specs/generated/', [System.StringComparison]::OrdinalIgnoreCase) }
          )
          if ($scopes.Count -eq 0) {
            "scope=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }

          "scope=$($scopes -join ',')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Validate SpecTrace render views
        if: steps.spectrace.outputs.scope != ''
        shell: pwsh
        run: |
          $scopes = "${{ steps.spectrace.outputs.scope }}".Split(',') | Where-Object { $_ }
          ./scripts/spec-trace/Render-SpecTraceMarkdownFromJson.ps1 -Check -Scope $scopes

      - name: Validate SpecTrace surfaces
        if: steps.spectrace.outputs.scope != ''
        shell: pwsh
        run: |
          $scopes = "${{ steps.spectrace.outputs.scope }}".Split(',') | Where-Object { $_ }
          $args = @('validate', '--profile', 'core')
          foreach ($scope in $scopes) {
            $args += @('--scope', $scope)
          }

          dotnet tool run workbench -- @args

      - name: Assert no SpecTrace CUE artifacts
        shell: pwsh
        run: ./scripts/Assert-No-SpecTraceCue.ps1

      - name: Restore
        run: dotnet restore Incursa.Quic.slnx

      - name: Build
        run: dotnet build Incursa.Quic.slnx --no-restore --configuration Release -p:ContinuousIntegrationBuild=true

      - name: Prepare interop harness mount roots
        run: |
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0
          sudo mkdir -p /certs /www /downloads /logs/qlog
          sudo chmod -R a+rwx /certs /www /downloads /logs

      - name: Test correctness suite
        run: dotnet test Incursa.Quic.slnx --no-build --configuration Release --filter "Category!=Performance"

      - name: Pack
        run: dotnet pack src/Incursa.Quic/Incursa.Quic.csproj --configuration Release --no-build /p:ContinuousIntegrationBuild=true

  protocol-lab-package-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: protocol-lab-package-smoke-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Http3
            package_id: quic-dotnet-dev
          - target: RawQuic
            package_id: quic-dotnet-raw-dev

    steps:
      - name: Checkout quic-dotnet
        uses: actions/checkout@v6
        with:
          path: quic-dotnet

      - name: Checkout public ProtocolLab contracts
        uses: actions/checkout@v6
        with:
          repository: incursa/protocol-lab
          path: protocol-lab

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: quic-dotnet/global.json

      - name: Build ProtocolLab implementation package
        shell: pwsh
        working-directory: quic-dotnet
        run: |
          $ErrorActionPreference = 'Stop'
          $outputPath = "artifacts/protocol-lab/packages/${{ matrix.package_id }}.ci.plabpkg"
          pwsh -NoProfile -File eng/protocol-lab/New-QuicDotNetProtocolLabPackage.ps1 `
            -PackageTarget ${{ matrix.target }} `
            -ProtocolLabRoot ../protocol-lab `
            -RuntimeIdentifier linux-x64 `
            -PackageVersion "ci-${{ github.run_id }}-${{ matrix.target }}" `
            -OutputPath $outputPath `
            -Force
          if (-not (Test-Path -LiteralPath $outputPath -PathType Leaf)) {
            throw "Expected package artifact was not produced: $outputPath"
          }

      - name: Validate ProtocolLab package archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $packagePath = "quic-dotnet/artifacts/protocol-lab/packages/${{ matrix.package_id }}.ci.plabpkg"
          if (-not (Test-Path -LiteralPath $packagePath -PathType Leaf)) {
            throw "Expected package artifact was not produced: $packagePath"
          }

          $archive = [System.IO.Compression.ZipFile]::OpenRead($packagePath)
          try {
            $entries = @{}
            foreach ($entry in $archive.Entries) {
              $entries[$entry.FullName] = $entry
            }

            foreach ($requiredEntry in @('protocol-lab-package.json', 'protocol-lab.internal.json')) {
              if (-not $entries.ContainsKey($requiredEntry)) {
                throw "Package archive missing required entry: $requiredEntry"
              }
            }

            function Read-ZipText([string]$entryName) {
              $stream = $entries[$entryName].Open()
              try {
                $reader = [System.IO.StreamReader]::new($stream)
                try {
                  return $reader.ReadToEnd()
                }
                finally {
                  $reader.Dispose()
                }
              }
              finally {
                $stream.Dispose()
              }
            }

            $publicManifestText = Read-ZipText 'protocol-lab-package.json'
            if ($publicManifestText -match '\bhttp\.(core|payload)\.' -or $publicManifestText -match '\bh3\.protocol\b') {
              throw 'Package public manifest contains stale generic HTTP scenario identifiers.'
            }

            $publicManifest = $publicManifestText | ConvertFrom-Json
            $internalManifest = (Read-ZipText 'protocol-lab.internal.json') | ConvertFrom-Json

            if ($publicManifest.schemaVersion -ne 'protocol-lab-package-v2') {
              throw "Unexpected public package schemaVersion: $($publicManifest.schemaVersion)"
            }

            if ($publicManifest.packageId -ne '${{ matrix.package_id }}') {
              throw "Unexpected packageId: $($publicManifest.packageId)"
            }

            if ([string]::IsNullOrWhiteSpace($publicManifest.packageVersion)) {
              throw 'Public package manifest is missing packageVersion.'
            }

            if ($publicManifest.kind -ne 'implementation') {
              throw "Unexpected package kind: $($publicManifest.kind)"
            }

            $entryManifests = @($publicManifest.entryManifests)
            if ($entryManifests.Count -eq 0) {
              throw 'Public package manifest does not declare entryManifests.'
            }

            foreach ($entryManifest in $entryManifests) {
              if (-not $entries.ContainsKey([string]$entryManifest)) {
                throw "Package archive missing declared entry manifest: $entryManifest"
              }
            }

            if ($internalManifest.schemaVersion -ne 'protocol-lab-internal-execution-v1') {
              throw "Unexpected internal package schemaVersion: $($internalManifest.schemaVersion)"
            }

            $providedImplementations = @($publicManifest.providedImplementations)
            if ($providedImplementations.Count -eq 0) {
              throw 'Public package manifest does not provide any implementation entries.'
            }

            $matchingImplementation = $providedImplementations |
              Where-Object { $_.implementationId -eq '${{ matrix.package_id }}' } |
              Select-Object -First 1
            if (-not $matchingImplementation) {
              throw 'Public package manifest does not provide the expected package implementation.'
            }
          }
          finally {
            $archive.Dispose()
          }
