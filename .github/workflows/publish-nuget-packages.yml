name: Publish NuGet Packages

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, for example 1.0.0
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: publish-packages-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Validate NuGet credentials
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw "NUGET_API_KEY secret is required to publish packages."
          }

      - name: Resolve package version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:MANUAL_VERSION)) {
            $version = $env:MANUAL_VERSION.Trim().TrimStart("v")
          }
          elseif ($env:RELEASE_TAG.StartsWith("v", [System.StringComparison]::OrdinalIgnoreCase)) {
            $version = $env:RELEASE_TAG.Substring(1)
          }
          else {
            throw "A version is required when the workflow is not triggered by a version tag."
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8NoBOM

      - name: Restore
        run: dotnet restore Incursa.Quic.slnx

      - name: Build
        run: dotnet build Incursa.Quic.slnx --no-restore --configuration Release -p:Version=${{ steps.version.outputs.version }} -p:ContinuousIntegrationBuild=true

      - name: Validate release/version policy
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          $tag = if ($env:MANUAL_VERSION) {
            "v$($env:MANUAL_VERSION.Trim().TrimStart('v'))"
          } else {
            $env:RELEASE_TAG
          }
          if (-not $tag) {
            throw "Manual publish requires 'version' input."
          }
          & "$env:GITHUB_WORKSPACE/scripts/release/validate-public-api-versioning.ps1" -Tag $tag

      - name: Pack packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/packages | Out-Null
          dotnet pack src/Incursa.Quic/Incursa.Quic.csproj --configuration Release --no-build --output artifacts/packages --include-symbols --include-source /p:Version=${{ steps.version.outputs.version }} /p:ContinuousIntegrationBuild=true
          dotnet pack src/Incursa.Quic.Dns/Incursa.Quic.Dns.csproj --configuration Release --no-build --output artifacts/packages --include-symbols --include-source /p:Version=${{ steps.version.outputs.version }} /p:ContinuousIntegrationBuild=true
          dotnet pack src/Incursa.Quic.Qlog/Incursa.Quic.Qlog.csproj --configuration Release --no-build --output artifacts/packages --include-symbols --include-source /p:Version=${{ steps.version.outputs.version }} /p:ContinuousIntegrationBuild=true
          dotnet pack src/Incursa.Qpack/Incursa.Qpack.csproj --configuration Release --no-build --output artifacts/packages --include-symbols --include-source /p:Version=${{ steps.version.outputs.version }} /p:ContinuousIntegrationBuild=true
          dotnet pack src/Incursa.Quic.Http3/Incursa.Quic.Http3.csproj --configuration Release --no-build --output artifacts/packages --include-symbols --include-source /p:Version=${{ steps.version.outputs.version }} /p:ContinuousIntegrationBuild=true

      - name: Validate ProtocolLab internal fixture token
        shell: pwsh
        env:
          PROTOCOL_LAB_INTERNAL_READ_TOKEN: ${{ secrets.PROTOCOL_LAB_INTERNAL_READ_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PROTOCOL_LAB_INTERNAL_READ_TOKEN)) {
            throw "PROTOCOL_LAB_INTERNAL_READ_TOKEN secret is required for package-backed Raw QUIC release conformance."
          }

      - name: Checkout ProtocolLab internal conformance fixture
        uses: actions/checkout@v7
        with:
          repository: incursa/protocol-lab-internal
          token: ${{ secrets.PROTOCOL_LAB_INTERNAL_READ_TOKEN }}
          path: protocol-lab-internal
          fetch-depth: 1

      - name: Run package-backed Raw QUIC conformance before publish
        shell: pwsh
        run: |
          ./scripts/release/Test-IncursaQuicPackageConformance.ps1 `
            -PackagePath "artifacts/packages/Incursa.Quic.${{ steps.version.outputs.version }}.nupkg" `
            -PackageVersion "${{ steps.version.outputs.version }}" `
            -ProtocolLabInternalRoot "protocol-lab-internal" `
            -ArtifactsRoot "artifacts/release/package-backed-raw-quic-conformance"

      - name: Upload package-backed Raw QUIC conformance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-backed-raw-quic-conformance-${{ steps.version.outputs.version }}
          path: artifacts/release/package-backed-raw-quic-conformance/
          if-no-files-found: error
          retention-days: 30

      - name: Push to NuGet
        run: |
          dotnet nuget push artifacts/packages/*.nupkg --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push artifacts/packages/*.snupkg --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
