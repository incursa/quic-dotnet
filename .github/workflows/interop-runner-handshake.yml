            implementation_slot: neqo
            peer_slots: msquic
            peer_image: ghcr.io/microsoft/msquic/qns:main
            testcases: connectionmigration
            runner_timeout_seconds: 240
          - cell: server-connectionmigration-aioquic-blocked
            local_role: server
            implementation_slot: neqo
            peer_slots: aioquic
            peer_image: aiortc/aioquic-qns:latest
            testcases: connectionmigration
            runner_timeout_seconds: 240
    steps:
      - name: Checkout quic-dotnet
        uses: actions/checkout@v6
        with:
          path: quic-dotnet

      - name: Checkout quic-interop-runner
