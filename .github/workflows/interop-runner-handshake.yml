          path: quic-dotnet/artifacts/interop-runner/${{ matrix.cell }}/
          if-no-files-found: warn

  major-peer-matrix:
    if: ${{ github.event.inputs.coverage_profile == 'major-peer-matrix' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: client-handshake-quic-go
            local_role: client
            implementation_slot: chrome
            peer_slots: quic-go
            peer_image: martenseemann/quic-go-interop:latest
            testcases: handshake
            runner_timeout_seconds: 0
          - cell: server-handshake-quic-go
            local_role: server
            implementation_slot: nginx
            peer_slots: quic-go
            peer_image: martenseemann/quic-go-interop:latest
            testcases: handshake
            runner_timeout_seconds: 0
          - cell: client-retry-quic-go
            local_role: client
            implementation_slot: chrome
            peer_slots: quic-go
            peer_image: martenseemann/quic-go-interop:latest
            testcases: retry
            runner_timeout_seconds: 0
          - cell: server-retry-quic-go
            local_role: server
            implementation_slot: nginx
            peer_slots: quic-go
            peer_image: martenseemann/quic-go-interop:latest
            testcases: retry
