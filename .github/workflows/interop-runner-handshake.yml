          editcap --version

      - name: Pre-pull runner peer images
        shell: bash
        run: |
          docker pull martenseemann/quic-network-simulator
          docker pull martenseemann/quic-go-interop:latest

      - name: Run server-zerortt-quic-go cell
        working-directory: quic-dotnet
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/interop/Invoke-QuicInteropRunner.ps1 `
            -RunnerRoot "${{ github.workspace }}/quic-interop-runner" `
            -LocalRole server `
            -ImplementationSlot nginx `
            -PeerImplementationSlots quic-go `
            -TestCases zerortt `
            -RunnerTimeoutSeconds 240 `
            -ArtifactsRoot "${{ github.workspace }}/quic-dotnet/artifacts/interop-runner/server-zerortt-quic-go"

      - name: Upload server-zerortt-quic-go artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: interop-runner-server-zerortt-quic-go-${{ github.run_id }}
          path: quic-dotnet/artifacts/interop-runner/server-zerortt-quic-go/
          if-no-files-found: warn

  connectionmigration-server-proof:
    if: ${{ github.event.inputs.coverage_profile == 'connectionmigration-server-proof' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: server-connectionmigration-neqo
            local_role: server
            implementation_slot: nginx
            peer_slots: neqo-peer
            peer_image: ghcr.io/mozilla/neqo-qns:latest
            testcases: connectionmigration
            runner_timeout_seconds: 240
    steps:
      - name: Checkout quic-dotnet
        uses: actions/checkout@v6
        with:
          path: quic-dotnet

      - name: Checkout quic-interop-runner
        uses: actions/checkout@v6
        with:
          repository: quic-interop/quic-interop-runner
          path: quic-interop-runner

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
