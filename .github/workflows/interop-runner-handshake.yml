            peer_image: martenseemann/quic-go-interop:latest
            testcases: transfer
            runner_timeout_seconds: 180
          - cell: client-keyupdate-quic-go
            local_role: client
            implementation_slot: chrome
            peer_slots: quic-go
            peer_image: martenseemann/quic-go-interop:latest
            testcases: keyupdate
            runner_timeout_seconds: 180
          - cell: server-keyupdate-quic-go
