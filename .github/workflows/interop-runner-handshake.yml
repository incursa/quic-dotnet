            implementation_slot: neqo
            peer_slots: lsquic
            peer_image: litespeedtech/lsquic-qir:latest
            testcases: connectionmigration
            runner_timeout_seconds: 240
          - cell: server-connectionmigration-quic-go-blocked
            local_role: server
            implementation_slot: neqo
            peer_slots: quic-go
            peer_image: martenseemann/quic-go-interop:latest
            testcases: connectionmigration
            runner_timeout_seconds: 240
          - cell: server-connectionmigration-msquic-blocked
