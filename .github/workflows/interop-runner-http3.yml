name: HTTP/3 Interop Runner

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/interop-runner-http3.yml"
      - "docs/interop-http3-runner.md"
      - "scripts/interop/**"
      - "src/Incursa.Qpack/**"
      - "src/Incursa.Quic/**"
      - "src/Incursa.Quic.Http3/**"
      - "src/Incursa.Quic.InteropHarness/**"

jobs:
  http3-local:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout quic-dotnet
        uses: actions/checkout@v7
        with:
          path: quic-dotnet

      - name: Checkout quic-interop-runner
        uses: actions/checkout@v7
        with:
          repository: quic-interop/quic-interop-runner
          path: quic-interop-runner

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Docker
        uses: docker/setup-docker-action@v5
        with:
          version: latest

      - name: Install runner packet-analysis tools
        shell: bash
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tshark

      - name: Install runner Python dependencies
        shell: pwsh
        run: python -m pip install -r quic-interop-runner/requirements.txt

      - name: Show runner prerequisites
        shell: pwsh
        run: |
          docker --version
          python --version
          tshark --version
          editcap --version

      - name: Pre-pull runner images
        shell: bash
        run: |
          docker pull martenseemann/quic-network-simulator
          docker pull martenseemann/quic-go-interop:latest

      - name: Run local HTTP/3 interop cell
        working-directory: quic-dotnet
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/interop/Invoke-QuicInteropRunner.ps1 `
            -RunnerRoot "${{ github.workspace }}/quic-interop-runner" `
            -LocalRole both `
            -ImplementationSlot quic-go `
            -PeerImplementationSlots quic-go `
            -TestCases http3 `
            -RunnerTimeoutSeconds 240 `
            -ArtifactsRoot "${{ github.workspace }}/quic-dotnet/artifacts/interop-runner/http3-local"

      - name: Upload HTTP/3 interop artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: interop-runner-http3-local-${{ github.run_id }}
          path: quic-dotnet/artifacts/interop-runner/http3-local/
          if-no-files-found: warn
